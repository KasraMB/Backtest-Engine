[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-backtest-engine"
version = "0.1.0"
description = "Bar-based futures backtesting and research tools"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
data = ["pyarrow>=12"]
simulation = ["numba>=0.59"]
ml = ["hmmlearn>=0.3", "xgboost>=2", "scikit-learn>=1.3"]
visualization = ["plotly>=5"]
dev = ["pytest>=7"]
research = [
    "pyarrow>=12",
    "numba>=0.59",
    "hmmlearn>=0.3",
    "xgboost>=2",
    "scikit-learn>=1.3",
    "plotly>=5",
]

[project.urls]
Repository = "https://github.com/KasraMB/Backtest-Engine"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["backtest*", "strategies*", "examples*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
