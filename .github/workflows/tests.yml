name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run data-free core tests
        run: >-
          python -m pytest
          tests/test_core_objects.py
          tests/test_engine.py
          tests/test_runner.py
          tests/test_example.py
          tests/test_strategy_imports.py
          -q
      - name: Run synthetic example
        run: python -m examples.basic_backtest
      - name: Build and install wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m examples.basic_backtest
          python -c "import importlib; assert importlib.import_module('strategies.asia_breakout_strategy') is importlib.import_module('strategies.no_edge.asia_breakout_strategy')"
